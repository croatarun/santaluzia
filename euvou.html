<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Luzia - Gerador de Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2d5a27; 
            --primary-hover: #1f3f1b;
            --bg: #f0f4f8; 
            --card-bg: #ffffff;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
            color: #1e293b;
        }
        .container { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1); 
            max-width: 440px; 
            width: 100%; 
            box-sizing: border-box;
        }
        h1 { 
            font-size: 16px; 
            text-align: center; 
            color: var(--primary); 
            letter-spacing: 1.5px; 
            margin-top: 0;
            margin-bottom: 20px; 
            text-transform: uppercase; 
            font-weight: 900;
        }
        .preview-box { 
            width: 100%; 
            aspect-ratio: 9/16; 
            background: #e2e8f0; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid #cbd5e1; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        .controls { 
            margin-top: 20px; 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
        }
        
        .control-group { margin-bottom: 15px; }
        .control-group:last-child { margin-bottom: 0; }
        
        label { 
            font-size: 11px; 
            font-weight: 700; 
            color: #64748b; 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 6px; 
            letter-spacing: 0.5px;
        }
        
        input[type="text"] { 
            width: 100%; 
            padding: 12px 16px; 
            border: 2px solid #cbd5e1; 
            border-radius: 10px; 
            font-family: 'Montserrat'; 
            font-weight: 700; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); outline: none; }
        input[type="range"] { width: 100%; height: 6px; accent-color: var(--primary); margin: 8px 0; cursor: pointer; }
        
        /* Ajustes Finos com Botões (D-Pad) */
        .dpad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin: 10px 0;
        }
        .dpad-row { display: flex; gap: 5px; }
        .btn-pad {
            background: #e2e8f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }
        .btn-pad:active { background: #cbd5e1; transform: scale(0.95); }

        .btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: none; 
            font-weight: 900; 
            font-size: 14px;
            cursor: pointer; 
            text-transform: uppercase; 
            transition: background 0.2s, transform 0.1s; 
            box-sizing: border-box;
        }
        .btn:active { transform: scale(0.98); }
        .btn-upload { background: #0f172a; color: white; margin-bottom: 15px; }
        .btn-upload:hover { background: #1e293b; }
        .btn-download { background: var(--primary); color: white; margin-top: 15px; box-shadow: 0 4px 12px rgba(45,90,39,0.2); }
        .btn-download:hover { background: var(--primary-hover); }
        
        .flex-row { display: flex; gap: 12px; }
        .flex-row > div { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>VIII Pedalada - Santa Luzia</h1>
    
    <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">1. Escolher Foto do Atleta</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="preview-box">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Nome do Atleta (vai na foto)</label>
            <input type="text" id="nomeAtleta" placeholder="EX: BRUNA">
        </div>

        <div class="control-group">
            <label>Zoom da Foto</label>
            <input type="range" id="zoom" min="0.1" max="4" step="0.01" value="1.2">
        </div>
        
        <div class="control-group">
            <label>Ajuste Fino de Posição (Clique ou Segure)</label>
            <div class="dpad-container">
                <button class="btn-pad" onclick="move('y', -10)">▲</button>
                <div class="dpad-row">
                    <button class="btn-pad" onclick="move('x', -10)">◀</button>
                    <button class="btn-pad" style="background:#cbd5e1; cursor:default;" onclick="resetPos()">⚫</button>
                    <button class="btn-pad" onclick="move('x', 10)">▶</button>
                </div>
                <button class="btn-pad" onclick="move('y', 10)">▼</button>
            </div>
        </div>

        <div class="flex-row" style="display: none;">
            <input type="range" id="posX" min="-600" max="600" value="0">
            <input type="range" id="posY" min="-600" max="600" value="0">
        </div>
    </div>

    <button class="btn btn-download" id="btnDownload">2. Salvar e Baixar Story</button>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const imgMoldura = new Image();
    const imgAtleta = new Image();

    const W = 1080, H = 1920;
    // Mapeamento preciso da caixa preta baseada na imagem da moldura
    const area = { x: 92, y: 72, w: 896, h: 938, r: 90 };
    const qualityScale = 3; 

    let molduraCarregada = false;

    canvas.width = W * qualityScale;
    canvas.height = H * qualityScale;
    ctx.scale(qualityScale, qualityScale);

    // Certifique-se de salvar a moldura com o nome correto na mesma pasta (pode ser .png ou .jpg)
    imgMoldura.src = 'euvou.png'; 
    
    imgMoldura.onload = () => {
        molduraCarregada = true;
        render();
    };
    imgMoldura.onerror = () => {
        // Fallback caso seja .jpg
        imgMoldura.src = 'euvou.jpg';
    };

    document.getElementById('fileInput').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (f) => {
                imgAtleta.src = f.target.result;
                imgAtleta.onload = render;
            };
            reader.readAsDataURL(file);
        }
    };

    // Ouvintes de eventos para inputs de texto e zoom
    document.getElementById('nomeAtleta').oninput = render;
    document.getElementById('zoom').oninput = render;

    // Funções auxiliares para movimentação facilitada
    function move(axis, value) {
        const input = document.getElementById(axis === 'x' ? 'posX' : 'posY');
        input.value = parseInt(input.value) + value;
        render();
    }

    function resetPos() {
        document.getElementById('posX').value = 0;
        document.getElementById('posY').value = 0;
        document.getElementById('zoom').value = 1.2;
        render();
    }

    function render() {
        ctx.clearRect(0, 0, W, H);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // 1. DESENHA A FOTO DO ATLETA (Fica por baixo)
        if (imgAtleta.src && imgAtleta.complete) {
            ctx.save();
            // Recorta a foto no formato do quadrado arredondado para não vazar nas bordas externas do story
            drawRoundedRect(ctx, area.x, area.y, area.w, area.h, area.r);
            ctx.clip();
            
            const z = parseFloat(document.getElementById('zoom').value);
            const px = parseInt(document.getElementById('posX').value);
            const py = parseInt(document.getElementById('posY').value);
            
            const aspect = imgAtleta.width / imgAtleta.height;
            let drawW = area.w * z;
            let drawH = (area.w / aspect) * z;
            
            // Garante preenchimento completo sem deixar frestas pretas
            if (drawH < area.h * z) {
                drawH = area.h * z;
                drawW = (area.h * aspect) * z;
            }
            
            ctx.drawImage(imgAtleta, 
                area.x + (area.w - drawW) / 2 + px, 
                area.y + (area.h - drawH) / 2 + py, 
                drawW, drawH
            );
            ctx.restore();
        } else {
            // Se não escolheu foto, mantém o fundo preto indicador
            ctx.save();
            ctx.fillStyle = "#1e293b";
            drawRoundedRect(ctx, area.x, area.y, area.w, area.h, area.r);
            ctx.fill();
            ctx.restore();
        }

        // 2. DESENHA A MOLDURA FIXA (Fica por cima, cobrindo o quadrado)
        if (molduraCarregada) {
            ctx.drawImage(imgMoldura, 0, 0, W, H);
        }

        // 3. TEXTOS ESCRITOS
        renderTextos();
    }

    function renderTextos() {
        const nome = document.getElementById('nomeAtleta').value.toUpperCase().trim();
        ctx.textAlign = 'center';
        if (nome) {
            ctx.font = "900 82px 'Montserrat'";
            ctx.fillStyle = "#111827"; // Cor escura premium para o nome
            ctx.fillText(nome, W / 2, 1435);
        }
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    document.getElementById('btnDownload').onclick = () => {
        if (!imgAtleta.src) return alert("Por favor, adicione sua foto antes de baixar!");
        const link = document.createElement('a');
        link.download = 'Pedalada_Santa_Luzia_Story.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    };
</script>

</body>
</html>
